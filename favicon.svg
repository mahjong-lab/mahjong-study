<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景グラデーション -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="60%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <!-- 牌の表面グラデーション -->
    <linearGradient id="tileFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#fdfcf8" />
      <stop offset="100%" stop-color="#f5efe6" />
    </linearGradient>

    <!-- 牌の竹・琥珀色背面グラデーション -->
    <linearGradient id="tileBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- ドロップシャドウ -->
    <filter id="tileShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- アイコン背景（角丸） -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- 牌の全体（ドロップシャドウ付き） -->
  <g filter="url(#tileShadow)">
    <!-- 琥珀色（竹）の厚みベース -->
    <rect x="136" y="86" width="240" height="340" rx="32" fill="url(#tileBack)" />

    <!-- 牌の表面（アイボリーホワイト） -->
    <rect x="136" y="80" width="240" height="326" rx="30" fill="url(#tileFace)" stroke="#e2e8f0" stroke-width="2" />

    <!-- 牌のインナーハイライト光沢 -->
    <rect x="144" y="88" width="224" height="6" rx="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- 牌の文字「中」（朱色・伝統書体ベクター） -->
  <g transform="translate(256, 238) scale(1.15)">
    <!-- 外枠（角丸長方形） -->
    <path d="M -54,-42 C -54,-48 -48,-54 -42,-54 L 42,-54 C 48,-54 54,-48 54,-42 L 54,20 C 54,26 48,32 42,32 L -42,32 C -48,32 -54,26 -54,20 Z" 
          fill="none" stroke="#dc2626" stroke-width="16" stroke-linejoin="round" />
    
    <!-- 中央縦棒（貫通） -->
    <path d="M 0,-76 L 0,84" 
          stroke="#dc2626" stroke-width="18" stroke-linecap="round" />

    <!-- 内側の左右空間アクセント -->
    <line x1="-32" y1="-11" x2="32" y2="-11" stroke="#dc2626" stroke-width="5" stroke-linecap="round" opacity="0.25" />
  </g>

  <!-- 右上の可愛いパズル・ひらめきバッジ（金色星マーク） -->
  <g transform="translate(376, 108)">
    <circle cx="0" cy="0" r="32" fill="#fef08a" stroke="#eab308" stroke-width="4" />
    <path d="M 0,-18 L 5,-5 L 18,-5 L 8,3 L 12,16 L 0,8 L -12,16 L -8,3 L -18,-5 L -5,-5 Z" fill="#ca8a04" />
  </g>
</svg>
